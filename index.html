<!doctype html>
<!-- class="dark" è qui e non in CSS: `dark` è un variant di Tailwind, non una
     utility, quindi non si può @apply. Il tema è scuro sempre, non si toglie. -->
<html lang="it-IT" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestionale Tom</title>
    <meta name="description" content="Gestionale per abbattimento e potatura alberi, manutenzione del verde, cippatura e smaltimento." />
    <meta name="theme-color" content="#0a0a0a" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Sfondo scuro prima che React monti: evita il flash bianco al reload.
         Il loader vero lo gestisce l'app. -->
    <style>
      html, body { margin: 0; background-color: #0a0a0a; }
      #root { min-height: 100vh; background-color: #0a0a0a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
